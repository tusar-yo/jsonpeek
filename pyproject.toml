[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonpeek"
version = "0.1.0"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.scripts]
jsonpeek = "jsonpeek.cli:main"

[tool.setuptools]
packages = ["jsonpeek"]
